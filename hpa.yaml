
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: grafana-hpa
  namespace: grafana-lab
  labels:
    app: grafana

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grafana

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
